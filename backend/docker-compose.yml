# Local stack. Values come from .env (copy .env.example). No real secrets are committed.
#
# With your own PostgreSQL (e.g. Neon) – set DB_URL / DB_USERNAME / DB_PASSWORD in .env:
#   docker compose up -d mongo            # databases you need locally (MongoDB = AI generation log)
#   docker compose up -d --build          # MongoDB + backend
# With a throwaway local PostgreSQL instead:
#   docker compose --profile local-db up -d postgres mongo
#   (then DB_URL=jdbc:postgresql://localhost:5433/foresight, DB_USERNAME=foresight, DB_PASSWORD=$POSTGRES_PASSWORD)
services:
  postgres:
    image: postgres:18-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foresight}
      POSTGRES_USER: ${POSTGRES_USER:-foresight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DB_URL: ${DB_URL:?set DB_URL in .env (your PostgreSQL JDBC URL)}
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      SPRING_MONGODB_URI: mongodb://mongo:27017/foresight?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:[*],http://127.0.0.1:[*]}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-none}
      APP_AI_MODEL: ${APP_AI_MODEL:-claude-opus-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-UTC}
    ports:
      - "${SERVER_HOST_PORT:-8080}:8080"

volumes:
  postgres-data:
  mongo-data:
