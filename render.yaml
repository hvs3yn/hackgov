# Render Blueprint for the Foresight backend (Dashboard -> New -> Blueprint, pick this repo).
# Secrets marked `sync: false` are prompted for on first deploy and never stored in git.
services:
  - type: web
    name: foresight-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      # PostgreSQL (Neon: use the DIRECT endpoint, not "-pooler")
      - key: DB_URL
        sync: false # jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      # Signing key for JWTs (Render generates a random 256-bit value)
      - key: APP_JWT_SECRET
        generateValue: true
      # Your deployed frontend origin(s), comma-separated, e.g. https://foresight.vercel.app
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: ""
      - key: APP_TIME_ZONE
        value: UTC
      # AI (optional): set APP_AI_PROVIDER=anthropic and ANTHROPIC_API_KEY to enable
      - key: APP_AI_PROVIDER
        value: none
      - key: APP_AI_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
